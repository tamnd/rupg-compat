name: Harness bug
description: The runner, the proxy, an oracle build or a suite does the wrong thing.
title: "harness: "
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for a bug in the harness itself. A difference between rupg and PostgreSQL goes to tamnd/rupg with the "Compatibility difference" template.
  - type: textarea
    id: what
    attributes:
      label: What occurred
      description: The command, what you expected and what occurred.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit of rupg-compat and the commit of rupg.
    validations:
      required: true
