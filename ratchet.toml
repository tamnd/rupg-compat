# The best number of each report row (spec/21 section 21.15).
# `rupg-compat report` fails when a number of the server under test is below its row here, or when a row here has no result. A number may go down only with an entry in spec/24 of tamnd/rupg that says why.
# The table name is the level and the key is "<version> <row>". The number is the count of the oracle less the differences, so a case that is unstable on the oracle is not a difference. `rupg-compat report --raise` writes the higher numbers here.
# The rows come with the first runs against rupg. A run of the oracle against itself does not set a ratchet.
