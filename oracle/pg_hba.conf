# The fixed host rules of every oracle (spec/21 section 21.3.3).
# TCP needs a SCRAM password, with or without TLS. The suites that switch users with `\c`, as the PostgreSQL regression suite does, use the Unix socket.
# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   127.0.0.1/32  scram-sha-256
host    all       all   ::1/128       scram-sha-256
