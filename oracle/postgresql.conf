# The fixed configuration of every oracle (spec/21 section 21.3.3). The same file configures the rupg server under test.
# `rupg-compat oracle build` adds these lines to the postgresql.conf that initdb wrote, after `initdb --no-locale -E UTF8`.
# A later line wins, so these values replace the values that initdb chose for this machine.

listen_addresses = '127.0.0.1'
max_connections = 100
shared_buffers = 128MB

# One sort order, one time zone and English messages on every machine.
TimeZone = 'UTC'
log_timezone = 'UTC'
DateStyle = 'ISO, MDY'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# SCRAM passwords and TLS with the fixed test certificate of this directory.
password_encryption = 'scram-sha-256'
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
