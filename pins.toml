# The pins of the harness: the PostgreSQL commits of the six oracles, the client versions and the rupg commit.
# A change to a pin is one commit to this file, and each change is a run of every suite (spec/21 section 21.3.3).
# The PostgreSQL pins agree with the vendored files of tamnd/rupg (vendor/postgres-N/PIN there).

[postgres]
# The source of every oracle. The build fetches one commit with a shallow fetch.
repository = "https://github.com/postgres/postgres.git"
# The oracle of this version is the reference. The others are the oracles of the shims of rupg.compat_version.
reference = 19

[postgres.19]
release = "19beta4"
ref = "REL_19_STABLE"
commit = "7d3d2db7d5e533fa42a4202c7d308cbb0cbf9333"

[postgres.18]
release = "18.6"
ref = "REL_18_6"
commit = "724edf9bde9d356724ad384a2e196edc3c9f80f7"

[postgres.17]
release = "17.11"
ref = "REL_17_11"
commit = "083ac033419f690758508e08c1736089384bbee8"

[postgres.16]
release = "16.15"
ref = "REL_16_15"
commit = "7d3e000c5961a544302072058a1184e9a588837b"

[postgres.15]
release = "15.19"
ref = "REL_15_19"
commit = "2ff1375b5dd8bf09d8cb0e795974528180fd75ca"

[postgres.14]
release = "14.24"
ref = "REL_14_24"
commit = "6b3806732b7c5df06bdd0ed150e8a07b4ad62315"

[rupg]
# The rupg commit under test. The harness does not link rupg. It talks to a rupg server through a socket.
repository = "https://github.com/tamnd/rupg"
commit = "ead90a6b89c373d927dabcfefbee755b886d9a50"

[clients]
# One table for each client whose trace or suite is in corpus/ or clients/, with the version that made it.
# The clients come in with their traces. See clients/<name>/. The version is the version that run.sh, go.mod or Cargo.toml installs.

[clients.asyncpg]
version = "0.32.0"

[clients.django]
version = "6.1.2"

[clients.golang-migrate]
version = "4.20.1"

[clients.lib-pq]
version = "1.12.3"

[clients.pg_dump]
# pg_dump and pg_restore of the oracle build of the reference version.
version = "19beta4"

[clients.pgx]
version = "5.11.0"

[clients.psql]
# The psql of the oracle build of the reference version.
version = "19beta4"

[clients.psycopg]
version = "3.3.6"

[clients.psycopg2]
version = "2.9.13"

[clients.sqlalchemy]
# SQLAlchemy with Alembic 1.20.0.
version = "2.1.3"

[clients.sqlx]
version = "0.9.0"

[clients.tokio-postgres]
version = "0.7.18"
