# The pins of the harness: the PostgreSQL commits of the six oracles, the client versions and the rupg commit.
# A change to a pin is one commit to this file, and each change is a run of every suite (spec/21 section 21.3.3).
# The PostgreSQL pins agree with the vendored files of tamnd/rupg (vendor/postgres-N/PIN there).

[postgres]
# The source of every oracle. The build fetches one commit with a shallow fetch.
repository = "https://github.com/postgres/postgres.git"
# The oracle of this version is the reference. The others are the oracles of the shims of rupg.compat_version.
reference = 19

[postgres.19]
release = "19beta4"
ref = "REL_19_STABLE"
commit = "7d3d2db7d5e533fa42a4202c7d308cbb0cbf9333"

[postgres.18]
release = "18.6"
ref = "REL_18_6"
commit = "724edf9bde9d356724ad384a2e196edc3c9f80f7"

[postgres.17]
release = "17.11"
ref = "REL_17_11"
commit = "083ac033419f690758508e08c1736089384bbee8"

[postgres.16]
release = "16.15"
ref = "REL_16_15"
commit = "7d3e000c5961a544302072058a1184e9a588837b"

[postgres.15]
release = "15.19"
ref = "REL_15_19"
commit = "2ff1375b5dd8bf09d8cb0e795974528180fd75ca"

[postgres.14]
release = "14.24"
ref = "REL_14_24"
commit = "6b3806732b7c5df06bdd0ed150e8a07b4ad62315"

[rupg]
# The rupg commit under test. The harness does not link rupg. It talks to a rupg server through a socket.
repository = "https://github.com/tamnd/rupg"
commit = "ead90a6b89c373d927dabcfefbee755b886d9a50"

[clients]
# One table for each client whose trace or suite is in corpus/ or clients/, with the version that made it.
# The clients come in with their traces. See clients/<name>/. The version is the version that run.sh, go.mod, Cargo.toml, package.json or pom.xml installs. The Node clients run on the Node.js of clients/node.sh, and the Java clients run on the JDK and Maven of clients/java.sh.

[clients.asyncpg]
version = "0.32.0"

[clients.diesel]
# Diesel CLI, with the libpq of the oracle build.
version = "2.3.13"

[clients.django]
version = "6.1.2"

[clients.drizzle]
# Drizzle ORM on node-postgres 8.23.1, with Drizzle Kit 0.31.11.
version = "0.45.3"

[clients.flyway]
# The Flyway command line with the PostgreSQL module, on pgjdbc 42.7.13.
version = "13.9.0"

[clients.golang-migrate]
version = "4.20.1"

[clients.grafana]
# The PostgreSQL data source that comes with it is version 13.0.3.
version = "13.2.3"

[clients.hibernate]
# Hibernate ORM on pgjdbc 42.7.13.
version = "7.4.12.Final"

[clients.lib-pq]
version = "1.12.3"

[clients.libpq]
# The libpq of the oracle build of the reference version.
version = "19beta4"

[clients.liquibase]
# Liquibase with picocli 4.7.7 for the command line, on pgjdbc 42.7.13.
version = "5.0.4"

[clients.node-postgres]
# The package pg.
version = "8.23.1"

[clients.pg_dump]
# pg_dump and pg_restore of the oracle build of the reference version.
version = "19beta4"

[clients.pgbouncer]
# Built with libevent 2.1.13-stable and without TLS.
version = "1.26.0"

[clients.pgcat]
version = "1.2.0"

[clients.pgjdbc]
# The package org.postgresql:postgresql.
version = "42.7.13"

[clients.pgx]
version = "5.11.0"

[clients.postgres-js]
# The package postgres.
version = "3.4.9"

[clients.prisma]
# The Prisma CLI and Prisma Client on @prisma/adapter-pg 7.10.0 and node-postgres 8.23.1.
version = "7.10.0"

[clients.psql]
# The psql of the oracle build of the reference version.
version = "19beta4"

[clients.psycopg]
version = "3.3.6"

[clients.psycopg2]
version = "2.9.13"

[clients.r2dbc-postgresql]
version = "1.1.3.RELEASE"

[clients.sequelize]
# On node-postgres 8.23.1.
version = "6.37.8"

[clients.sqlalchemy]
# SQLAlchemy with Alembic 1.20.0.
version = "2.1.3"

[clients.sqlx]
version = "0.9.0"

[clients.superset]
# With the pins of clients/superset/constraints.txt and psycopg2 2.9.13.
version = "6.1.0"

[clients.tokio-postgres]
version = "0.7.18"

[clients.typeorm]
# On node-postgres 8.23.1.
version = "1.1.1"
